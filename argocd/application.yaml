apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-incident-assistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # Picked up by argocd-image-updater (if installed) so ArgoCD auto-detects new
  # ECR tags pushed by CI and rolls them out via a Git write-back — no manual PR.
  annotations:
    argocd-image-updater.argoproj.io/image-list: ai-svc=<ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/ai-incident-assistant
    argocd-image-updater.argoproj.io/ai-svc.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  project: default

  source:
    repoURL: https://github.com/sachinms95/truflo-ai-incident-assistant.git
    targetRevision: main
    path: helm/ai-incident-assistant
    helm:
      valueFiles:
        - values.yaml
      # ArgoCD Image Updater rewrites this at deploy time to the freshly-built ECR tag
      parameters:
        - name: image.tag
          value: latest

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-incident-assistant

  syncPolicy:
    automated:
      prune: true      # remove resources deleted from Git
      selfHeal: true    # revert manual cluster drift back to Git state
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
